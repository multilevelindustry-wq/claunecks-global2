<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Find available jobs, gigs, contracts and work opportunities. Contact the employer or opportunity uploader directly."><meta name="robots" content="index,follow,max-image-preview:large"><title>Create Jobs & Work Opportunities | Claunecks Global</title><meta name="google-adsense-account" content="ca-pub-9884706884825746"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9884706884825746" crossorigin="anonymous"></script><link rel="stylesheet" href="../../css/style.css"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script><script src="../../js/firebase-config.js"></script></head><body><div id="siteHeader"></div><main class="page-wrap"><section class="form-card"><span class="eyebrow">PUBLISH ON Claunecks Global</span><h1>Create jobs & work opportunities listing</h1><form class="createListingForm" data-module="jobs"><label>Listing title<input required name="title" maxlength="120"></label><label>Description<textarea required name="description" rows="6" placeholder="Describe what you offer in clear detail..."></textarea></label><label>Category<select name="category"><option>Full-time jobs</option><option>Part-time jobs</option><option>Remote jobs</option><option>Freelance work</option><option>Temporary jobs</option><option>Internships</option><option>Graduate jobs</option><option>Customer service</option><option>Sales jobs</option><option>Teaching jobs</option><option>Driving jobs</option><option>Delivery jobs</option><option>Technology jobs</option><option>Design jobs</option><option>Writing jobs</option><option>Construction work</option><option>Hospitality jobs</option><option>Healthcare jobs</option><option>Administrative jobs</option><option>Skilled trades</option></select></label><label>Country<input required name="country" placeholder="Country"></label><label>City / region<input name="city"></label><label>Currency<select name="currency"><option>NGN</option><option>GHS</option><option>USD</option><option>GBP</option><option>EUR</option><option>CAD</option><option>ZAR</option><option>KES</option></select></label><label>Price / budget (optional)<input name="price" placeholder="e.g. 25000"></label><label>Employment type<select name="employmentType"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Temporary</option><option>Internship</option><option>Freelance</option></select></label><label>Work mode<select name="workMode"><option>On-site</option><option>Remote</option><option>Hybrid</option></select></label><label>Salary / compensation range<input name="salary" placeholder="e.g. NGN 150,000 - 250,000 monthly"></label><label>Application deadline<input name="deadline" type="date"></label><label>Upload photos / cover image<input type="file" name="images" accept="image/*" multiple></label><label>Or image URL<input name="imageUrl" type="url" placeholder="https://..."></label><label>WhatsApp number for enquiries<input name="whatsapp" placeholder="International digits, e.g. 2348012345678"></label><label>WhatsApp / social contact URL<input name="contactUrl" placeholder="https://wa.me/... or social profile URL"></label><div class="upload-progress"><span id="uploadProgress"></span></div><button class="btn primary">Publish listing</button></form></section></main><div id="siteFooter"></div><script src="../../js/app.js"></script></body></html>
