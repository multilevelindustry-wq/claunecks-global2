<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Showcase mobile, desktop and web apps to people looking for useful tools."><meta name="robots" content="index,follow,max-image-preview:large"><title>Create App Discovery | Claunecks Global</title><meta name="google-adsense-account" content="ca-pub-9884706884825746"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9884706884825746" crossorigin="anonymous"></script><link rel="stylesheet" href="../../css/style.css"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script><script src="../../js/firebase-config.js"></script></head><body><div id="siteHeader"></div><main class="page-wrap"><section class="form-card"><span class="eyebrow">PUBLISH ON Claunecks Global</span><h1>Create app discovery listing</h1><form class="createListingForm" data-module="apps"><label>Listing title<input required name="title" maxlength="120"></label><label>Description<textarea required name="description" rows="6" placeholder="Describe what you offer in clear detail..."></textarea></label><label>Category<select name="category"><option>Android apps</option><option>iOS apps</option><option>Productivity apps</option><option>Education apps</option><option>Finance apps</option><option>Lifestyle apps</option><option>Games</option><option>Health apps</option><option>Business apps</option><option>Photography apps</option><option>Utilities</option><option>Entertainment apps</option><option>Developer tools</option><option>Social apps</option><option>Travel apps</option><option>Other apps</option></select></label><label>Country<input required name="country" placeholder="Country"></label><label>City / region<input name="city"></label><label>Currency<select name="currency"><option>NGN</option><option>GHS</option><option>USD</option><option>GBP</option><option>EUR</option><option>CAD</option><option>ZAR</option><option>KES</option></select></label><label>Price / budget (optional)<input name="price" placeholder="e.g. 25000"></label><label>Official app download URL<input name="downloadUrl" placeholder="Official Play Store, App Store or website URL"></label><label>Platform<input name="platform" placeholder="Android, iOS, Web, Windows..."></label><div class="notice">AdSense does not allow incentivised ad views or clicks. This build uses normal, policy-compliant ad placements; it does not force visitors to click or watch ads to unlock downloads.</div><label>Upload photos / cover image<input type="file" name="images" accept="image/*" multiple></label><label>Or image URL<input name="imageUrl" type="url" placeholder="https://..."></label><label>WhatsApp number for enquiries<input name="whatsapp" placeholder="International digits, e.g. 2348012345678"></label><label>WhatsApp / social contact URL<input name="contactUrl" placeholder="https://wa.me/... or social profile URL"></label><div class="upload-progress"><span id="uploadProgress"></span></div><button class="btn primary">Publish listing</button></form></section></main><div id="siteFooter"></div><script src="../../js/app.js"></script></body></html>
