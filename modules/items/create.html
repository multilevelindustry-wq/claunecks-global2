<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sell physical products with photos, product options and variations."><meta name="robots" content="index,follow,max-image-preview:large"><title>Create Marketplace | Claunecks Global</title><meta name="google-adsense-account" content="ca-pub-9884706884825746"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9884706884825746" crossorigin="anonymous"></script><link rel="stylesheet" href="../../css/style.css"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script><script src="../../js/firebase-config.js"></script></head><body><div id="siteHeader"></div><main class="page-wrap"><section class="form-card"><span class="eyebrow">PUBLISH ON Claunecks Global</span><h1>Create marketplace listing</h1><form class="createListingForm" data-module="items"><label>Listing title<input required name="title" maxlength="120"></label><label>Description<textarea required name="description" rows="6" placeholder="Describe what you offer in clear detail..."></textarea></label><label>Category<select name="category"><option>Fashion</option><option>Electronics</option><option>Phones and accessories</option><option>Home and living</option><option>Beauty products</option><option>Shoes</option><option>Bags</option><option>Furniture</option><option>Computers</option><option>Sports equipment</option><option>Baby products</option><option>Groceries</option><option>Jewellery</option><option>Automotive</option><option>Handmade goods</option><option>Office supplies</option><option>Wellness</option><option>Toys</option><option>Garden supplies</option><option>Other items</option></select></label><label>Country<input required name="country" placeholder="Country"></label><label>City / region<input name="city"></label><label>Currency<select name="currency"><option>NGN</option><option>GHS</option><option>USD</option><option>GBP</option><option>EUR</option><option>CAD</option><option>ZAR</option><option>KES</option></select></label><label>Price / budget (optional)<input name="price" placeholder="e.g. 25000"></label><label>Product variations / options (add 5 or more where relevant)<textarea name="variations" rows="4" placeholder="Size: Small, Medium, Large&#10;Colour: Black, White&#10;Material: Cotton&#10;Model: ..."></textarea></label><label>Stock quantity<input name="stock" type="number" min="0"></label><label>Upload photos / cover image<input type="file" name="images" accept="image/*" multiple></label><label>Or image URL<input name="imageUrl" type="url" placeholder="https://..."></label><label>WhatsApp number for enquiries<input name="whatsapp" placeholder="International digits, e.g. 2348012345678"></label><label>WhatsApp / social contact URL<input name="contactUrl" placeholder="https://wa.me/... or social profile URL"></label><div class="upload-progress"><span id="uploadProgress"></span></div><button class="btn primary">Publish listing</button></form></section></main><div id="siteFooter"></div><script src="../../js/app.js"></script></body></html>
