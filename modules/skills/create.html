><option>Music production</option><option>Tutoring</option><option>Accounting</option><option>UI and UX design</option><option>Business plans</option></select></label><label>Country<input required name="country" placeholder="Country"></label><label>City / region<input name="city"></label><label>Currency<select name="currency"><option>NGN</option><option>GHS</option><option>USD</option><option>GBP</option><option>EUR</option><option>CAD</option><option>ZAR</option><option>KES</option></select></label><label>Price / budget (optional)<input name="price" placeholder="e.g. 25000"></label><label>Service package / deliverables<textarea name="packageDetails" rows="3"></textarea></label><label>Delivery timeframe<input name="deliveryTime"></label><label>Upload photos / cover image<input type="file" name="images" accept="image/*" multiple></label><label>Or image URL<input name="imageUrl" type="url" placeholder="https://..."></label><label>WhatsApp number for enquiries<input name="whatsapp" placeholder="International digits, e.g. 2348012345678"></label><label>WhatsApp / social contact URL<input name="contactUrl" placeholder="https://wa.me/... or social profile URL"></label><div class="upload-progress"><span id="uploadProgress"></span></div><button class="btn primary">Publish listing</button></form></section></main><div id="siteFooter"></div><script src="../../js/app.js"></script></body></html>
